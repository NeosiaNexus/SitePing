version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Conventional title: the repo is squash-only, so the PR title must pass
    # the PR-title check and be parseable by the auto-labeller.
    commit-message:
      prefix: chore
      include: scope
    # Wait a week before adopting a new release: a freshly compromised
    # package version is usually yanked within days. Security advisories
    # bypass the cooldown.
    cooldown:
      default-days: 7
    groups:
      # The coverage provider must ship the same major as vitest itself:
      # separate major-bump PRs each fail CI alone (#223/#225). No
      # update-types filter — majors included — so the family always
      # arrives as one lockstep PR. Listed first: dependabot assigns each
      # dependency to the first matching group.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # The demo image pins its bases by digest (supply-chain: a tag is mutable).
  # Without this entry the digests would never move again and the images would
  # silently rot — pinning is only safe when something bumps the pins.
  - package-ecosystem: docker
    directory: /apps/demo
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
