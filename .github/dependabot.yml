version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Conventional title: the repo is squash-only, so the PR title must pass
    # the PR-title check and be parseable by the auto-labeller.
    commit-message:
      prefix: chore
      include: scope
    # Wait a week before adopting a new release: a freshly compromised
    # package version is usually yanked within days. Security advisories
    # bypass the cooldown.
    cooldown:
      default-days: 7
    # Group membership is NOT "first matching group" (as GitHub's docs say):
    # dependabot-core assigns each dependency to the MOST SPECIFIC matching
    # group — exact name 1000, a group without `patterns` 500, a wildcard
    # like `@vitest/*` ~90. The catch-all groups below have no patterns, so
    # they beat any wildcard: the job log said "Skipping
    # @vitest/coverage-istanbul for group 'vitest' - belongs to more specific
    # group 'dev-dependencies'", whose minor/patch filter then dropped the
    # major into a lone PR (#285/#288). Lockstep families therefore list
    # every member by exact name AND are excluded from the catch-alls.
    groups:
      # The coverage provider must ship the same major as vitest itself:
      # separate major-bump PRs each fail CI alone (#223/#225, #285/#288).
      # No update-types filter — majors included — so the family always
      # arrives as one lockstep PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-istanbul"
          - "@vitest/*"
      # Every @size-limit/* plugin pins size-limit exactly (peer +
      # dependency): split PRs (#265/#266) each go green alone but leave a
      # nested duplicate CLI in the lockfile.
      size-limit:
        patterns:
          - "size-limit"
          - "@size-limit/file"
          - "@size-limit/*"
      # bun ignores `dependency-type` (every job warns "The 'dependency-type'
      # option is not supported for the 'bun' package manager"), yet the
      # observed dev/prod split is still right — kept until that changes.
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "size-limit"
          - "@size-limit/*"
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "size-limit"
          - "@size-limit/*"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      # init and analyze run in the same job and refuse to mix versions
      # ("Loaded a configuration file for version '4.37.3', but running
      # version '4.38.0'"), so split bumps each fail CodeQL alone: every
      # trio from 4.37.4 (#257) to 4.38.0 (#289-#291) was superseded
      # unmerged. No update-types filter, so upload-sarif (scorecard.yml)
      # and majors move with them as one PR.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
    open-pull-requests-limit: 5

  # The demo image pins its bases by digest (supply-chain: a tag is mutable).
  # Without this entry the digests would never move again and the images would
  # silently rot — pinning is only safe when something bumps the pins.
  #
  # Digest refreshes only. The tags themselves are deliberate and coupled to
  # things this file cannot see: `node:20-alpine` matches the oldest Node major
  # the packages support (and the version the publish jobs run), and the bun tag
  # must stay in lockstep with `packageManager` and the `oven-sh/setup-bun` pin
  # in the workflows. Left alone, Dependabot proposed node 20 -> 26 and bumped
  # bun on its own, which would have split that agreement silently.
  #
  # Ignoring the three semver update-types does NOT also mute digest updates:
  # each one expands to a version RANGE strictly above the current version
  # (`> x.y.z`, `>= x.(y+1)`, `>= (x+1)`), and a digest refresh keeps the same
  # tag, so it never falls inside them. Moving a tag is a manual, coordinated
  # change.
  - package-ecosystem: docker
    directory: /apps/demo
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 5
